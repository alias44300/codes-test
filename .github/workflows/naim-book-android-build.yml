name: Naïm Book Android APK

on:
  push:
    branches: [naim-book-android]
    paths:
      - 'naim-book-android/**'
      - '.github/workflows/naim-book-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild and repair source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re, shutil, zipfile
          root = Path('naim-book-android')
          chunks = sorted((root / 'source_zip').glob('chunk_*.b64'))
          if not chunks:
              raise SystemExit('No source chunks found')
          raw = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          data = base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]', '', raw), validate=False)
          incoming = root / 'incoming-source.zip'
          incoming.write_bytes(data)
          print('incoming source bytes', len(data))
          buildsrc = root / 'buildsrc'
          if buildsrc.exists():
              shutil.rmtree(buildsrc)
          buildsrc.mkdir(parents=True)
          skipped = []
          with zipfile.ZipFile(incoming) as zf:
              for info in zf.infolist():
                  if info.filename.endswith('/app/src/main/assets/book-data.js'):
                      skipped.append(info.filename)
                      continue
                  zf.extract(info, buildsrc)
          if len(skipped) != 1:
              raise SystemExit(f'Expected one generated book-data.js entry, got {skipped}')
          project = buildsrc / 'Naim_Mondes_Impossibles_Android'
          book_path = project / 'app/src/main/assets/book.json'
          book = json.loads(book_path.read_text(encoding='utf-8'))
          generated = 'window.NAIM_BOOK_DATA = ' + json.dumps(book, ensure_ascii=False, indent=2) + ';\n'
          (project / 'app/src/main/assets/book-data.js').write_text(generated, encoding='utf-8')
          repaired_base = root / 'Naim_Mondes_Impossibles_Android_Source'
          repaired_zip = repaired_base.with_suffix('.zip')
          if repaired_zip.exists():
              repaired_zip.unlink()
          shutil.make_archive(str(repaired_base), 'zip', root_dir=buildsrc, base_dir='Naim_Mondes_Impossibles_Android')
          print('repaired source bytes', repaired_zip.stat().st_size)
          PY
          unzip -t naim-book-android/Naim_Mondes_Impossibles_Android_Source.zip

      - name: Validate complete book
        working-directory: naim-book-android/buildsrc/Naim_Mondes_Impossibles_Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          b=json.load(open('app/src/main/assets/book.json', encoding='utf-8'))
          assert b['pageCount']==240
          assert b['sceneCount']==60
          assert len(b['chapters'])==10
          assert sum(len(c['scenes']) for c in b['chapters'])==60
          assert all(len(c['scenes'])==6 for c in b['chapters'])
          assert all(len(s['pages'])==3 for c in b['chapters'] for s in c['scenes'])
          assert all(len(s['choices'])==3 for c in b['chapters'] for s in c['scenes'])
          assert all(len(s['results'])==3 for c in b['chapters'] for s in c['scenes'])
          assert sum(len(s['choices']) for c in b['chapters'] for s in c['scenes'])==180
          print('240 pages / 60 scenes / 60 decisions / 180 options: OK')
          PY
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/book-data.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Create release signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          KEYSTORE="$GITHUB_WORKSPACE/naim-book-android/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 -alias naimbook -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname 'CN=Naim Mondes Impossibles, OU=Android Book, O=Naim Book, C=FR'
          echo "NAIM_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "NAIM_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "NAIM_KEY_ALIAS=naimbook" >> "$GITHUB_ENV"
          echo "NAIM_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: naim-book-android/buildsrc/Naim_Mondes_Impossibles_Android
        run: gradle --no-daemon --stacktrace clean :app:assembleRelease

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/naim-book-android/buildsrc/Naim_Mondes_Impossibles_Android"
          OUT="$GITHUB_WORKSPACE/naim-book-android/package"
          mkdir -p "$OUT"
          cp "$PROJECT/app/build/outputs/apk/release/app-release.apk" "$OUT/Naim_et_les_Mondes_Impossibles_v1.0.apk"
          cp "$GITHUB_WORKSPACE/naim-book-android/Naim_Mondes_Impossibles_Android_Source.zip" "$OUT/"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/Naim_et_les_Mondes_Impossibles_v1.0.apk" > "$OUT/CERTIFICATE_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$OUT/Naim_et_les_Mondes_Impossibles_v1.0.apk" > "$OUT/ZIPALIGN_REPORT.txt"
          printf '%s\n' 'Package: com.naim.mondesimpossibles' 'Version: 1.0.0' 'Pages: 240' 'Chapters: 10' 'Scenes: 60' 'Choice points: 60' 'Choice options: 180' 'Offline: yes' 'Read aloud: Android TTS' 'Auto-save: yes' 'Minimum Android: 7.0' > "$OUT/BUILD_REPORT.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Naim-Mondes-Impossibles-v1.0
          path: naim-book-android/package/*
          if-no-files-found: error
          retention-days: 30
