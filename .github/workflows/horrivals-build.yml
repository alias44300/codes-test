name: Build HORRIVALS Game Studio APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: horrivals
        run: npm install --no-audit --no-fund

      - name: Typecheck and build web game
        working-directory: horrivals
        run: npm run build

      - name: Create Capacitor Android project
        working-directory: horrivals
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: horrivals/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK package, alignment and signature
        working-directory: horrivals
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HORRIVALS-GameStudio-Android
          if-no-files-found: error
          retention-days: 7
          path: |
            horrivals/android/app/build/outputs/apk/debug/app-debug.apk
            horrivals/android/app/build/outputs/apk/debug/SHA256SUMS.txt
