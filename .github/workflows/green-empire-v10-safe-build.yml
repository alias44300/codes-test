name: Green Empire v1.0 Safe Android APK

on:
  push:
    branches: [green-empire-v1.0-apk-build]
    paths:
      - 'green-empire-v10-safe/**'
      - '.github/workflows/green-empire-v10-safe-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'green-empire-v10-safe/**'
      - '.github/workflows/green-empire-v10-safe-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify safe source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('green-empire-v10-safe/source_zip')
          names = [f'chunk_{i:02d}.b64' for i in range(17)]
          names[9] = 'chunk_09_fixed.b64'
          parts = [root / name for name in names]
          expected_text_sha = [
              '2622a597ab1b4aeaaf2c309708497fd0000b39d6926361f81683cf2854a8ec11',
              '14c8da8add3217e10d07ffe32df0d752cb31a978f67735c6e008857dcff75f14',
              '164932f304012447139ce2f4222b9eb74e690c66cf504b37c2d5af0fef093311',
              'f8a3b76ec3f286216e9bc02b750356b9d4b8a71dbad6b2cd859872e9b3f6c4d8',
              '9b82f1b73ca00713f08d7d2a45496ee926a9d4bb3372d9519d2f1f4742c54122',
              '8166f9b316a6fd8dbfb83e95417eea94065585a75abe18b5069275447e86b1ca',
              '70f7640770a990836fb7d981f7dc7a52ba3acbf3290504436b0f28d3fffff924',
              'a23480d32d1cc9bb0b58083712f755a3b0e1ca559fa1e611285b58e789159973',
              '4a110559ee664719fceaaeaa45f8263a903c4c8d898e8779e7dfc7380b4d4936',
              '1daa319983a6294c3561673494368975c9e14bbe450b067f0e9867767c3b8499',
              '296e09ca8a29a1c7e9dd3d9e0d4ae32e435e50fa2d3b5542b180d1fa99e2f191',
              'c531afcd6664a0c296f9b7a993424349de02ace4577014e71f45bd287bf85bc1',
              'fdfb45ff4fe86113caf6544a9ae31873d891aa4c585db17c740e514f8fc41864',
              '7e1563ccf7773711a4e55999b46d829035d54f59f5ef8a58eb6821884998c4d4',
              'e900325573786d26fd6982e901d64a290c6bf29db7dcb12c957b98bc6049250c',
              '2aba61a7b35aec55b1682bba85c01803ea4d442a8ab2f91237157feb792ffe9e',
              'ab9496ec74b88bdec441bc9c0495bd210941cbb7e3be8bae7eda09c195155e15',
          ]
          decoded = []
          for i, p in enumerate(parts):
              if not p.is_file():
                  raise SystemExit(f'Missing source chunk: {p}')
              raw = p.read_bytes()
              raw_sha = hashlib.sha256(raw).hexdigest()
              print(f'{p.name}: bytes={len(raw)} sha256={raw_sha}')
              if raw_sha != expected_text_sha[i]:
                  raise SystemExit(
                      f'Chunk mismatch {p.name}: expected {expected_text_sha[i]}, got {raw_sha}'
                  )
              decoded.append(base64.b64decode(raw.strip(), validate=True))

          data = b''.join(decoded)
          digest = hashlib.sha256(data).hexdigest()
          expected = 'af16633f39da2e5124788b2ce429c67b60cd1000b2298f662c3bd603f1363e53'
          print('source sha256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA mismatch: expected {expected}, got {digest}')
          Path('green-empire-v10-safe/source.zip').write_bytes(data)
          PY
          unzip -t green-empire-v10-safe/source.zip
          rm -rf green-empire-v10-safe/buildsrc
          mkdir -p green-empire-v10-safe/buildsrc
          unzip -q green-empire-v10-safe/source.zip -d green-empire-v10-safe/buildsrc
          test -f green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/project.godot
          test -f green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/export_presets.cfg

      - name: Apply Godot 4.3 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match in {path} for {old!r}, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          logistics = project / 'scripts/logistics/logistics_manager.gd'
          replace_once(
              logistics,
              '    var seed_value := abs(seed_text.hash() + mode.hash())',
              '    var seed_value: int = absi(seed_text.hash() + mode.hash())',
          )

          game = project / 'scripts/game_state.gd'
          replacements = [
              ('    var quality_factor := [0.0, 1.0, 1.28, 1.62, 2.05, 2.55][clampi(quality, 1, 5)]',
               '    var quality_factor: float = float([0.0, 1.0, 1.28, 1.62, 2.05, 2.55][clampi(quality, 1, 5)])'),
              ('    var event_discount := temporary_supplier_discount if GameClock.total_game_minutes < temporary_supplier_discount_until else 0.0',
               '    var event_discount: float = temporary_supplier_discount if GameClock.total_game_minutes < temporary_supplier_discount_until else 0.0'),
              ('    var buyer_discount := _effect_value("buyer") + _research_effect("supplier_discount") + event_discount',
               '    var buyer_discount: float = _effect_value("buyer") + _research_effect("supplier_discount") + event_discount'),
              ('    var unit_price := float(product.get("base_buy_per_kg", 1500.0)) * float(supplier.get("price_factor", 1.0)) * quality_factor * (1.0 - clampf(buyer_discount, 0.0, 0.25))',
               '    var unit_price: float = float(product.get("base_buy_per_kg", 1500.0)) * float(supplier.get("price_factor", 1.0)) * quality_factor * (1.0 - clampf(buyer_discount, 0.0, 0.25))'),
              ('    var purchase_cost := unit_price * kg',
               '    var purchase_cost: float = unit_price * kg'),
              ('    var transport_cost := float(logistics["transport_cost"])',
               '    var transport_cost: float = float(logistics["transport_cost"])'),
              ('    var total := purchase_cost + transport_cost',
               '    var total: float = purchase_cost + transport_cost'),
              ('    var q_factor := [0.0, 0.82, 1.0, 1.23, 1.52, 1.88][clampi(quality, 1, 5)]',
               '    var q_factor: float = float([0.0, 0.82, 1.0, 1.23, 1.52, 1.88][clampi(quality, 1, 5)])'),
              ('    var saturation_penalty := 1.0 - clampf(float(market.get("saturation", 0.0)), 0.0, 0.45)',
               '    var saturation_penalty: float = 1.0 - clampf(float(market.get("saturation", 0.0)), 0.0, 0.45)'),
              ('    var sales_bonus := _effect_value("sales") + _equipment_effect("sales") + _research_effect("market_bonus") + _effect_value("analyst") * 0.30',
               '    var sales_bonus: float = _effect_value("sales") + _equipment_effect("sales") + _research_effect("market_bonus") + _effect_value("analyst") * 0.30'),
              ('    var quality_management := _effect_value("quality") + _equipment_effect("quality") + _research_effect("quality_bonus")',
               '    var quality_management: float = _effect_value("quality") + _equipment_effect("quality") + _research_effect("quality_bonus")'),
              ('    var brand_bonus := clampf(brand_score / 500.0, 0.0, 0.12)',
               '    var brand_bonus: float = clampf(brand_score / 500.0, 0.0, 0.12)'),
              ('    var management_bonus := clampf(quality_management * 0.35, 0.0, 0.10)',
               '    var management_bonus: float = clampf(quality_management * 0.35, 0.0, 0.10)'),
              ('    var unit_price := float(product.get("base_sell_per_kg", 2200.0)) * q_factor * float(hub.get("market_demand", 1.0)) * float(market.get("demand_mod", 1.0)) * saturation_penalty * (1.0 + sales_bonus + brand_bonus + management_bonus)',
               '    var unit_price: float = float(product.get("base_sell_per_kg", 2200.0)) * q_factor * float(hub.get("market_demand", 1.0)) * float(market.get("demand_mod", 1.0)) * saturation_penalty * (1.0 + sales_bonus + brand_bonus + management_bonus)'),
          ]
          for old, new in replacements:
              replace_once(game, old, new)

          preset = project / 'export_presets.cfg'
          replace_once(preset, 'gradle_build/min_sdk="24"\n', '')

          print('Applied Godot 4.3 compatibility fixes.')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify project
        working-directory: green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/verify_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;23.2.8568313'

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$KEYSTORE"

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL --retry 5 --retry-delay 2 \
            -o "$RUNNER_TEMP/godot/godot.zip" \
            'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip'
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -maxdepth 1 -type f -name 'Godot_v4.3-stable_linux*' | head -n1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fL --retry 5 --retry-delay 2 \
            -o "$RUNNER_TEMP/godot/templates.tpz" \
            'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz'
          rm -rf "$RUNNER_TEMP/godot/templates-unpacked"
          mkdir -p "$RUNNER_TEMP/godot/templates-unpacked"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates-unpacked"
          cp -a "$RUNNER_TEMP/godot/templates-unpacked/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          "$GODOT_BIN" --version

      - name: Import project with Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete"
          mkdir -p "$PROJECT/build"
          "$GODOT_BIN" --headless --editor --path "$PROJECT" --quit --verbose \
            2>&1 | tee "$PROJECT/build/GODOT_IMPORT.log"

      - name: Export Android debug APK with Godot 4.3
        shell: bash
        run: |
          set -o pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete"
          APK="$PROJECT/build/Green_Empire_Europe_v1.0.apk"
          "$GODOT_BIN" --headless --verbose --path "$PROJECT" \
            --export-debug 'Android' "$APK" \
            2>&1 | tee "$PROJECT/build/GODOT_EXPORT.log"
          status=${PIPESTATUS[0]}
          echo "Godot export exit code: $status"
          exit "$status"

      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Godot-diagnostics
          path: |
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/GODOT_IMPORT.log
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/GODOT_EXPORT.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete"
          APK="$PROJECT/build/Green_Empire_Europe_v1.0.apk"
          test -s "$APK"
          sdkmanager 'build-tools;35.0.0' >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$PROJECT/build/APK_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" | tee "$PROJECT/build/ZIPALIGN.txt"
          (cd "$PROJECT/build" && sha256sum Green_Empire_Europe_v1.0.apk > Green_Empire_Europe_v1.0.apk.sha256)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Android-debug-safe
          path: |
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk.sha256
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/APK_SIGNATURE.txt
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/ZIPALIGN.txt
          if-no-files-found: error
          retention-days: 30
