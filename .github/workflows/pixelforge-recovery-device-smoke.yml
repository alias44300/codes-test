name: PixelForge Recovery Device Smoke

on:
  push:
    branches: [pixelforge-apk-build]
    paths:
      - '.github/workflows/pixelforge-recovery-device-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixelforge-apk-build

      - name: Check recovery APK exists
        run: test -s ci-results/PixelForgeStudio-0.9.1-recovery.apk

      - name: Boot emulator, install and launch PixelForge
        id: emulator
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r ci-results/PixelForgeStudio-0.9.1-recovery.apk | tee device-install.txt
            adb logcat -c
            adb shell am force-stop com.pixelforge.studio
            adb shell am start -W -n com.pixelforge.studio/.MainActivity | tee device-launch.txt
            sleep 3
            adb shell dumpsys activity activities | tee device-activities.txt
            grep -E 'mResumedActivity.*com\.pixelforge\.studio|topResumedActivity=.*com\.pixelforge\.studio' device-activities.txt
            adb logcat -d -t 800 > device-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.pixelforge\.studio.*has died' device-logcat.txt; then
              echo 'PixelForge runtime crash detected' >&2
              exit 1
            fi

      - name: Publish device smoke evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "emulator_outcome=${{ steps.emulator.outcome }}"
            echo "api_level=35"
          } > ci-results/pixelforge-device-smoke-status.txt
          for f in device-install.txt device-launch.txt device-activities.txt device-logcat.txt; do
            [ -f "$f" ] && cp "$f" "ci-results/$f" || true
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results
          git commit -m "ci: record PixelForge device smoke ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:pixelforge-apk-build

      - name: Fail if emulator smoke failed
        if: always()
        run: test "${{ steps.emulator.outcome }}" = success
