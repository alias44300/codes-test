name: "Atlas des Gantiers - APK Android"
on:
  push:
    branches:
      - atlas-gantiers-android-apk-20261106
    paths:
      - 'atlas-gantiers-android/**'
      - '.github/workflows/atlas-gantiers-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: atlas-gantiers-android
    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "SDK 35 deja disponible."
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then echo "sdkmanager absent sous $ANDROID_HOME"; exit 1; fi
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Vérifier 363 marques et 45 pays
        run: python3 qa/check_project.py
      - name: Tester le moteur de cadrage photo
        run: node qa/test_photo_crop.js
      - name: Tester la navigation pays / marques
        run: node qa/test_country_navigation.js
      - name: Compiler APK debug installable
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleSafe
      - name: Enregistrer APK Android
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Atlas-des-Gantiers-v1.0.11-APK
          path: |
            atlas-gantiers-android/app/build/outputs/apk/debug/app-debug.apk
            atlas-gantiers-android/app/build/outputs/apk/safe/app-safe.apk
          retention-days: 30
