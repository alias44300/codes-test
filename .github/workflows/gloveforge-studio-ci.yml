name: GloveForge Studio CI

on:
  push:
    branches: [gloveforge-studio]
    paths:
      - 'gloveforge-studio/**'
      - '.github/workflows/gloveforge-studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat gloveforge-studio/source_zip/chunk_*.b64 | tr -d '\n\r ' | base64 -d > gloveforge-studio/source.zip
          unzip -t gloveforge-studio/source.zip
          rm -rf gloveforge-studio/work
          mkdir -p gloveforge-studio/work
          unzip -q gloveforge-studio/source.zip -d gloveforge-studio/work
          tr -d '\n\r ' < gloveforge-studio/v4-overrides.b64 | base64 -d > gloveforge-studio/v4-overrides.decoded.zip
          unzip -t gloveforge-studio/v4-overrides.decoded.zip
          unzip -oq gloveforge-studio/v4-overrides.decoded.zip -d gloveforge-studio/work/gloveforge-studio

      - name: Install real CC-BY boxing glove mesh
        shell: bash
        run: |
          set -euo pipefail
          MODEL='gloveforge-studio/work/gloveforge-studio/public/glove-model'
          mkdir -p "$MODEL/textures"
          BASE='https://raw.githubusercontent.com/josericardopenase/BoxingVR/main/public/glove'
          curl -fsSL "$BASE/scene.gltf" -o "$MODEL/scene.gltf"
          curl -fsSL "$BASE/scene.bin" -o "$MODEL/scene.bin"
          curl -fsSL "$BASE/textures/main_baseColor.jpeg" -o "$MODEL/textures/main_baseColor.jpeg"
          curl -fsSL "$BASE/textures/main_metallicRoughness.png" -o "$MODEL/textures/main_metallicRoughness.png"
          curl -fsSL "$BASE/textures/main_normal.png" -o "$MODEL/textures/main_normal.png"
          curl -fsSL "$BASE/license.txt" -o "$MODEL/LICENSE.txt"
          test -s "$MODEL/scene.gltf"
          test -s "$MODEL/scene.bin"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gloveforge-studio/work/gloveforge-studio
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: gloveforge-studio/work/gloveforge-studio
        run: npm run build

      - name: Verify model and v4 configurator are bundled
        shell: bash
        run: |
          set -euo pipefail
          test -s gloveforge-studio/work/gloveforge-studio/dist/glove-model/scene.gltf
          test -s gloveforge-studio/work/gloveforge-studio/dist/glove-model/scene.bin
          test -s gloveforge-studio/work/gloveforge-studio/dist/glove-model/textures/main_normal.png
          grep -R "Elite Mexican Premium" gloveforge-studio/work/gloveforge-studio/dist/assets >/dev/null
          grep -R "UV" gloveforge-studio/work/gloveforge-studio/dist/assets >/dev/null

      - name: Package verified build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gloveforge-studio/package
          mkdir -p gloveforge-studio/package
          (cd gloveforge-studio/work && zip -qr ../package/GloveForge_Studio_Source.zip gloveforge-studio)
          cp -r gloveforge-studio/work/gloveforge-studio/dist gloveforge-studio/package/web-build
          (cd gloveforge-studio/package && sha256sum GloveForge_Studio_Source.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GloveForge_Studio_build
          path: gloveforge-studio/package
          if-no-files-found: error
          retention-days: 30
