name: PixelForge Recovery APK v2

on:
  push:
    branches: [pixelforge-apk-build]
    paths:
      - 'pixelforge-recovery/**'
      - '.github/workflows/pixelforge-recovery-build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixelforge-apk-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Configure Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install and verify Android SDK 37
        id: sdk37
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results

          SDKMANAGER="$(command -v sdkmanager)"
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" | tee ci-results/sdkmanager-path.txt
          "$SDKMANAGER" --version | tee ci-results/sdkmanager-version.txt

          # Android 17 / API 37 is currently exposed by sdkmanager as
          # platforms;android-37.0. Include preview channels explicitly.
          "$SDKMANAGER" --list --channel=3 --sdk_root="$ANDROID_SDK_ROOT" > ci-results/sdk-packages-all.txt
          grep -F 'platforms;android-37.0' ci-results/sdk-packages-all.txt > ci-results/sdk-api37-available.txt
          grep -F 'build-tools;36.0.0' ci-results/sdk-packages-all.txt > ci-results/sdk-buildtools-available.txt

          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            --channel=3 \
            --sdk_root="$ANDROID_SDK_ROOT"

          PLATFORM_JAR="$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$PLATFORM_JAR"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"

          {
            echo 'ANDROID_SDK_37_READY'
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "platform=$PLATFORM_JAR"
            echo "build_tools=$BUILD_TOOLS"
            echo "adb=$ANDROID_SDK_ROOT/platform-tools/adb"
          } | tee ci-results/android-sdk-37-doctor.txt

      - name: Build recovery app
        id: gradle_build
        if: steps.sdk37.outcome == 'success'
        continue-on-error: true
        working-directory: pixelforge-recovery
        shell: bash
        run: |
          set +e
          gradle --version | tee gradle-version.txt
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Verify APK
        id: verify_apk
        if: steps.gradle_build.outcome == 'success'
        continue-on-error: true
        working-directory: pixelforge-recovery
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$APK"
          unzip -t "$APK" > apk-unzip.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Publish CI evidence to temporary branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "sdk37_outcome=${{ steps.sdk37.outcome }}"
            echo "gradle_outcome=${{ steps.gradle_build.outcome }}"
            echo "gradle_exit_code=${{ steps.gradle_build.outputs.exit_code }}"
            echo "verify_outcome=${{ steps.verify_apk.outcome }}"
          } > ci-results/pixelforge-recovery-status.txt
          cp pixelforge-recovery/build.log ci-results/pixelforge-recovery-build.log || true
          cp pixelforge-recovery/gradle-version.txt ci-results/gradle-version.txt || true
          if [ -f pixelforge-recovery/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp pixelforge-recovery/app/build/outputs/apk/debug/app-debug.apk ci-results/PixelForgeStudio-0.9.1-recovery.apk
          fi
          for f in apk-unzip.txt apk-signature.txt apk-badging.txt apk-sha256.txt; do
            [ -f "pixelforge-recovery/$f" ] && cp "pixelforge-recovery/$f" "ci-results/$f" || true
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results
          git commit -m "ci: record PixelForge recovery build ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:pixelforge-apk-build

      - name: Fail job if toolchain, build or verification failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.sdk37.outcome }}" = success
          test "${{ steps.gradle_build.outcome }}" = success
          test "${{ steps.verify_apk.outcome }}" = success
