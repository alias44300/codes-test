name: Green Empire v0.4 Signed APK

on:
  push:
    branches: [green-empire-v0.3.1-build-test]
    paths:
      - 'green-empire-v04/**'
      - '.github/workflows/green-empire-v04-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          chunks = sorted(Path('green-empire-v04/source_zip').glob('chunk_*.b64'))
          if len(chunks) != 6:
              raise SystemExit(f'Expected 6 chunks, found {len(chunks)}')
          raw = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          data = base64.b64decode(clean, validate=False)
          archive = Path('green-empire-v04/source.zip')
          archive.write_bytes(data)
          print(len(data))
          PY
          unzip -t green-empire-v04/source.zip
          mkdir -p green-empire-v04/buildsrc
          unzip -q green-empire-v04/source.zip -d green-empire-v04/buildsrc
          node --check green-empire-v04/buildsrc/Green_Empire_Europe_v0.4_Android/app/src/main/assets/game.js

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create release signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/green-empire-v04/signing"
          PASS="$(openssl rand -hex 20)"
          KEYSTORE="$GITHUB_WORKSPACE/green-empire-v04/signing/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 -alias greenempire-v04 -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname 'CN=Green Empire Europe, OU=Game Studio, O=Green Empire, L=Nantes, ST=Loire-Atlantique, C=FR'
          echo "GREEN_EMPIRE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GREEN_EMPIRE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "GREEN_EMPIRE_KEY_ALIAS=greenempire-v04" >> "$GITHUB_ENV"
          echo "GREEN_EMPIRE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release
        working-directory: green-empire-v04/buildsrc/Green_Empire_Europe_v0.4_Android
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v04/buildsrc/Green_Empire_Europe_v0.4_Android"
          APK="$PROJECT/app/build/outputs/apk/release/app-release.apk"
          OUT="$GITHUB_WORKSPACE/green-empire-v04/package"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/Green_Empire_Europe_v0.4.0_signed.apk"
          cp "$GITHUB_WORKSPACE/green-empire-v04/source.zip" "$OUT/Green_Empire_Europe_v0.4_Android_Source.zip"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/Green_Empire_Europe_v0.4.0_signed.apk" | tee "$OUT/CERTIFICATE_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$OUT/Green_Empire_Europe_v0.4.0_signed.apk" | tee "$OUT/ZIPALIGN_REPORT.txt"
          printf '%s\n' 'Package: com.greenempire.europe' 'Version: 0.4.0 (40)' 'Minimum Android: 8.0' 'Build: signed release APK' 'Physical-device test: not performed by CI' > "$OUT/BUILD_REPORT.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Green_Empire_Europe_v0.4_signed_package
          path: green-empire-v04/package/*
          if-no-files-found: error
          retention-days: 30
