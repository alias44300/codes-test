name: PixelForge M9 tail fingerprint diagnostic

on:
  push:
    branches: [pixelforge-apk-build]
    paths: ['.github/workflows/pixelforge-m9-tail-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixelforge-apk-build
      - shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          expected = {
            'c3c23daf76cdcbd8c3387a71be7dc55ed9e68bfa':(21,5000),
            'e8cd9d04e5393e07a29cd720012ae3de099dfc04':(22,5000),
            '4c2e00b61b4544bcb2fd3f49c685f5c7d9972640':(23,5000),
            'c2959a4303677017d6d8f1d22784be7ebe769a36':(24,5000),
            'aa53b20285efe39d9f2b50f72b426ac62f465de6':(25,5000),
            'aa252695e2e70835d2db6d4dc463b8e8136ca447':(26,5000),
            'a4ccfb1819a9262bae7bc93a35cd3781e85ce7d7':(27,5000),
            'a5904075abcaaa63f2c4d24e07122542294fad07':(28,5000),
            'ed758c6f9b276ffd0d80d278879b8541df71d51c':(29,5000),
            '6dc920a2d6ddb0cc6b5937f50d0cb619359de3b7':(30,5000),
            'fed0b932237dbf006e269a8051481450aeda3fbe':(31,5000),
            'c7442db99ab1f378d9764a31647f4ec3717f07b8':(32,5000),
            '0de957395018b9ab1210b237449c47867cd0e8bc':(33,5000),
            '8f2db420f8e5e91ded7b25a040f8b6b4e2a6976f':(34,5000),
            '586f89d1d9bab7a7ad620eecc4d553d5376ba71f':(35,2184),
          }
          found = {}
          candidates = sorted(Path('pixelforge-apk/source_zip').glob('*.b64')) + sorted(Path('pixelforge-apk/source_zip_v2').glob('*.b64'))
          for p in candidates:
            text = ''.join(p.read_text().split())
            for n in (5000,2184):
              wanted = {h for h,(i,l) in expected.items() if l == n and h not in found}
              if not wanted or len(text) < n: continue
              prefix = f'blob {n}\0'.encode()
              for start in range(len(text)-n+1):
                w = text[start:start+n]
                h = hashlib.sha1(prefix+w.encode()).hexdigest()
                if h in wanted:
                  i,_ = expected[h]; found[h]=(p,start)
                  print(f'PART_{i:02d}=FOUND file={p} offset={start}')
                  wanted.remove(h)
                  if not wanted: break
          missing = [i for h,(i,n) in expected.items() if h not in found]
          print('FOUND_COUNT=',len(found))
          print('MISSING=',','.join(f'{i:02d}' for i in missing))
          if missing: sys.exit(2)
          PY
