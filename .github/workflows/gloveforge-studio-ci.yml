name: GloveForge Studio CI

on:
  push:
    branches: [gloveforge-studio]
    paths:
      - 'gloveforge-studio/**'
      - '.github/workflows/gloveforge-studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and install v0.4 overrides
        shell: bash
        run: |
          set -euo pipefail
          cat gloveforge-studio/source_zip/chunk_*.b64 | tr -d '\n\r ' | base64 -d > gloveforge-studio/source.zip
          unzip -t gloveforge-studio/source.zip
          rm -rf gloveforge-studio/work
          mkdir -p gloveforge-studio/work
          unzip -q gloveforge-studio/source.zip -d gloveforge-studio/work
          ROOT='gloveforge-studio/work/gloveforge-studio'
          cp gloveforge-studio/v4/src/types.ts "$ROOT/src/types.ts"
          cp gloveforge-studio/v4/src/store.ts "$ROOT/src/store.ts"
          cp gloveforge-studio/v4/src/App.tsx "$ROOT/src/App.tsx"
          cp gloveforge-studio/v4/src/components/Controls.tsx "$ROOT/src/components/Controls.tsx"
          cp gloveforge-studio/v4/src/components/Glove3D.tsx "$ROOT/src/components/Glove3D.tsx"
          cp gloveforge-studio/v4/src/components/ZoneMaterial.tsx "$ROOT/src/components/ZoneMaterial.tsx"
          cp gloveforge-studio/v4/src/lib/surfaceTexture.ts "$ROOT/src/lib/surfaceTexture.ts"
          cat gloveforge-studio/v4/v4-extra.css >> "$ROOT/src/styles.css"

      - name: Install real CC-BY boxing glove mesh
        shell: bash
        run: |
          set -euo pipefail
          MODEL='gloveforge-studio/work/gloveforge-studio/public/glove-model'
          mkdir -p "$MODEL/textures"
          BASE='https://raw.githubusercontent.com/josericardopenase/BoxingVR/main/public/glove'
          curl -fsSL "$BASE/scene.gltf" -o "$MODEL/scene.gltf"
          curl -fsSL "$BASE/scene.bin" -o "$MODEL/scene.bin"
          curl -fsSL "$BASE/textures/main_baseColor.jpeg" -o "$MODEL/textures/main_baseColor.jpeg"
          curl -fsSL "$BASE/textures/main_metallicRoughness.png" -o "$MODEL/textures/main_metallicRoughness.png"
          curl -fsSL "$BASE/textures/main_normal.png" -o "$MODEL/textures/main_normal.png"
          curl -fsSL "$BASE/license.txt" -o "$MODEL/LICENSE.txt"
          test -s "$MODEL/scene.gltf"
          test -s "$MODEL/scene.bin"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: gloveforge-studio/work/gloveforge-studio
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: gloveforge-studio/work/gloveforge-studio
        run: npm run build

      - name: Verify model and configurator are bundled
        shell: bash
        run: |
          set -euo pipefail
          test -s gloveforge-studio/work/gloveforge-studio/dist/glove-model/scene.gltf
          test -s gloveforge-studio/work/gloveforge-studio/dist/glove-model/scene.bin
          test -s gloveforge-studio/work/gloveforge-studio/dist/glove-model/textures/main_normal.png
          grep -R "Elite Mexican Premium" gloveforge-studio/work/gloveforge-studio/dist/assets >/dev/null
          grep -R "BoxElite + Doogma" gloveforge-studio/work/gloveforge-studio/dist/assets >/dev/null
          grep -R "gloveforge-config-v4" gloveforge-studio/work/gloveforge-studio/dist/assets >/dev/null

      - name: Visual WebGL smoke test
        working-directory: gloveforge-studio/work/gloveforge-studio
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 --directory dist >/tmp/gloveforge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const page = await browser.newPage({viewport:{width:720,height:1280},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle'});
            await page.waitForTimeout(2500);
            const canvas = page.locator('canvas');
            if (await canvas.count() < 1) throw new Error('No WebGL canvas rendered');
            const box = await canvas.boundingBox();
            if (!box || box.width < 300 || box.height < 300) throw new Error('Canvas viewport too small');
            await page.screenshot({path:'/tmp/gloveforge-visual.png',fullPage:false});
            if (errors.length) throw new Error('Page errors: '+errors.join(' | '));
            await browser.close();
          })();
          NODE

      - name: Package verified build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gloveforge-studio/package
          mkdir -p gloveforge-studio/package
          (cd gloveforge-studio/work && zip -qr ../package/GloveForge_Studio_Source.zip gloveforge-studio)
          cp -r gloveforge-studio/work/gloveforge-studio/dist gloveforge-studio/package/web-build
          cp /tmp/gloveforge-visual.png gloveforge-studio/package/visual-smoke.png
          (cd gloveforge-studio/package && sha256sum GloveForge_Studio_Source.zip > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GloveForge_Studio_build
          path: gloveforge-studio/package
          if-no-files-found: error
          retention-days: 30
