name: Green Empire v1.0 Final2 APK

on:
  push:
    branches: [green-empire-v1.0-apk-build]
    paths:
      - 'green-empire-v10-safe/**'
      - '.github/workflows/green-empire-v10-apk-final2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'green-empire-v10-safe/**'
      - '.github/workflows/green-empire-v10-apk-final2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root=Path('green-empire-v10-safe/source_zip')
          names=[f'chunk_{i:02d}.b64' for i in range(17)]
          names[9]='chunk_09_fixed.b64'
          data=b''.join(base64.b64decode((root/n).read_text().strip(),validate=True) for n in names)
          got=hashlib.sha256(data).hexdigest(); want='af16633f39da2e5124788b2ce429c67b60cd1000b2298f662c3bd603f1363e53'
          print('source sha256:',got)
          if got!=want: raise SystemExit(f'SHA mismatch: {got}')
          Path('green-empire-v10-safe/source.zip').write_bytes(data)
          PY
          unzip -t green-empire-v10-safe/source.zip
          rm -rf green-empire-v10-safe/buildsrc && mkdir -p green-empire-v10-safe/buildsrc
          unzip -q green-empire-v10-safe/source.zip -d green-empire-v10-safe/buildsrc

      - name: Patch Godot 4.3 compatibility and Android project settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete')
          def one(path,old,new):
              t=path.read_text(encoding='utf-8'); c=t.count(old)
              if c!=1: raise SystemExit(f'{path}: expected 1 match for {old!r}, got {c}')
              path.write_text(t.replace(old,new,1),encoding='utf-8')
          lm=p/'scripts/logistics/logistics_manager.gd'
          one(lm,'    var seed_value := abs(seed_text.hash() + mode.hash())','    var seed_value: int = absi(seed_text.hash() + mode.hash())')
          gs=p/'scripts/game_state.gd'
          fixes=[
          ('    var quality_factor := [0.0, 1.0, 1.28, 1.62, 2.05, 2.55][clampi(quality, 1, 5)]','    var quality_factor: float = float([0.0, 1.0, 1.28, 1.62, 2.05, 2.55][clampi(quality, 1, 5)])'),
          ('    var event_discount := temporary_supplier_discount if GameClock.total_game_minutes < temporary_supplier_discount_until else 0.0','    var event_discount: float = temporary_supplier_discount if GameClock.total_game_minutes < temporary_supplier_discount_until else 0.0'),
          ('    var buyer_discount := _effect_value("buyer") + _research_effect("supplier_discount") + event_discount','    var buyer_discount: float = _effect_value("buyer") + _research_effect("supplier_discount") + event_discount'),
          ('    var unit_price := float(product.get("base_buy_per_kg", 1500.0)) * float(supplier.get("price_factor", 1.0)) * quality_factor * (1.0 - clampf(buyer_discount, 0.0, 0.25))','    var unit_price: float = float(product.get("base_buy_per_kg", 1500.0)) * float(supplier.get("price_factor", 1.0)) * quality_factor * (1.0 - clampf(buyer_discount, 0.0, 0.25))'),
          ('    var purchase_cost := unit_price * kg','    var purchase_cost: float = unit_price * kg'),
          ('    var transport_cost := float(logistics["transport_cost"])','    var transport_cost: float = float(logistics["transport_cost"])'),
          ('    var total := purchase_cost + transport_cost','    var total: float = purchase_cost + transport_cost'),
          ('    var q_factor := [0.0, 0.82, 1.0, 1.23, 1.52, 1.88][clampi(quality, 1, 5)]','    var q_factor: float = float([0.0, 0.82, 1.0, 1.23, 1.52, 1.88][clampi(quality, 1, 5)])'),
          ('    var saturation_penalty := 1.0 - clampf(float(market.get("saturation", 0.0)), 0.0, 0.45)','    var saturation_penalty: float = 1.0 - clampf(float(market.get("saturation", 0.0)), 0.0, 0.45)'),
          ('    var sales_bonus := _effect_value("sales") + _equipment_effect("sales") + _research_effect("market_bonus") + _effect_value("analyst") * 0.30','    var sales_bonus: float = _effect_value("sales") + _equipment_effect("sales") + _research_effect("market_bonus") + _effect_value("analyst") * 0.30'),
          ('    var quality_management := _effect_value("quality") + _equipment_effect("quality") + _research_effect("quality_bonus")','    var quality_management: float = _effect_value("quality") + _equipment_effect("quality") + _research_effect("quality_bonus")'),
          ('    var brand_bonus := clampf(brand_score / 500.0, 0.0, 0.12)','    var brand_bonus: float = clampf(brand_score / 500.0, 0.0, 0.12)'),
          ('    var management_bonus := clampf(quality_management * 0.35, 0.0, 0.10)','    var management_bonus: float = clampf(quality_management * 0.35, 0.0, 0.10)'),
          ('    var unit_price := float(product.get("base_sell_per_kg", 2200.0)) * q_factor * float(hub.get("market_demand", 1.0)) * float(market.get("demand_mod", 1.0)) * saturation_penalty * (1.0 + sales_bonus + brand_bonus + management_bonus)','    var unit_price: float = float(product.get("base_sell_per_kg", 2200.0)) * q_factor * float(hub.get("market_demand", 1.0)) * float(market.get("demand_mod", 1.0)) * saturation_penalty * (1.0 + sales_bonus + brand_bonus + management_bonus)')]
          for a,b in fixes: one(gs,a,b)
          proj=p/'project.godot'; t=proj.read_text(encoding='utf-8')
          if 'textures/vram_compression/import_etc2_astc=true' not in t:
              t=t.replace('[rendering]\n','[rendering]\ntextures/vram_compression/import_etc2_astc=true\n',1)
          proj.write_text(t,encoding='utf-8')
          ep=p/'export_presets.cfg'; t=ep.read_text(encoding='utf-8')
          t=t.replace('gradle_build/min_sdk="24"','gradle_build/min_sdk=""')
          t=t.replace('launcher_icons/adaptive_foreground_432x432="res://assets/ui/icon.png"','launcher_icons/adaptive_foreground_432x432=""')
          t=t.replace('launcher_icons/adaptive_background_432x432="res://assets/ui/icon.png"','launcher_icons/adaptive_background_432x432=""')
          t=t.replace('package/signed=true','package/signed=false')
          ep.write_text(t,encoding='utf-8')
          print('ETC2/ASTC:', 'textures/vram_compression/import_etc2_astc=true' in proj.read_text())
          PY

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify project
        working-directory: green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/verify_project.py

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3

      - name: Configure Android SDK and required debug keystore
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;34.0.0' 'build-tools;35.0.0' 'platforms;android-34' 'cmdline-tools;latest'
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$KEYSTORE"

      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL --retry 5 --retry-delay 2 -o "$RUNNER_TEMP/godot/godot.zip" 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip'
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -maxdepth 1 -type f -name 'Godot_v4.3-stable_linux*' | head -n1)"
          chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -fL --retry 5 --retry-delay 2 -o "$RUNNER_TEMP/godot/templates.tpz" 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz'
          mkdir -p "$RUNNER_TEMP/godot/t"; unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/t"
          cp -a "$RUNNER_TEMP/godot/t/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          "$GODOT_BIN" --version

      - name: Import and export unsigned APK
        shell: bash
        run: |
          set -o pipefail
          P="$GITHUB_WORKSPACE/green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete"; mkdir -p "$P/build"
          "$GODOT_BIN" --headless --editor --path "$P" --quit --verbose 2>&1 | tee "$P/build/GODOT_IMPORT.log" || exit ${PIPESTATUS[0]}
          U="$P/build/Green_Empire_Europe_v1.0-unsigned.apk"
          "$GODOT_BIN" --headless --verbose --path "$P" --export-debug 'Android' "$U" 2>&1 | tee "$P/build/GODOT_EXPORT.log"
          exit ${PIPESTATUS[0]}

      - name: Align, sign and verify final APK
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete"
          U="$P/build/Green_Empire_Europe_v1.0-unsigned.apk"; A="$P/build/Green_Empire_Europe_v1.0-aligned.apk"; F="$P/build/Green_Empire_Europe_v1.0.apk"
          test -s "$U"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$U" "$A"
          cp "$A" "$F"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$F"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$F" | tee "$P/build/APK_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$F" | tee "$P/build/ZIPALIGN.txt"
          (cd "$P/build" && sha256sum Green_Empire_Europe_v1.0.apk > Green_Empire_Europe_v1.0.apk.sha256)

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Final2-diagnostics
          path: |
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/GODOT_IMPORT.log
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/GODOT_EXPORT.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Final2-APK
          path: |
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk.sha256
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/APK_SIGNATURE.txt
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/ZIPALIGN.txt
          if-no-files-found: error
          retention-days: 30
