plugins { id 'com.android.application' }

android {
    namespace 'fr.atlasgantiers.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.atlasgantiers.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.3'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
