name: Green Empire v1.0 Android APK

on:
  push:
    branches: [green-empire-v1.0-apk-build]
    paths:
      - 'green-empire-v10-final/**'
      - '.github/workflows/green-empire-v10-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'green-empire-v10-final/**'
      - '.github/workflows/green-empire-v10-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="green-empire-v10-final/source.zip"
          test -s "$SOURCE"
          sha256sum "$SOURCE" | tee green-empire-v10-final/SOURCE_SHA256.txt
          unzip -t "$SOURCE"
          rm -rf green-empire-v10-final/buildsrc
          mkdir -p green-empire-v10-final/buildsrc
          unzip -q "$SOURCE" -d green-empire-v10-final/buildsrc
          test -f green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/project.godot
          test -f green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/export_presets.cfg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify project
        working-directory: green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/verify_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android debug APK with Godot 4.3
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          verbose: true

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete"
          APK="$PROJECT/build/Green_Empire_Europe_v1.0.apk"
          test -s "$APK"
          sdkmanager 'build-tools;35.0.0' >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$PROJECT/build/APK_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" | tee "$PROJECT/build/ZIPALIGN.txt"
          (cd "$PROJECT/build" && sha256sum Green_Empire_Europe_v1.0.apk > Green_Empire_Europe_v1.0.apk.sha256)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Android-debug
          path: |
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk.sha256
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/APK_SIGNATURE.txt
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/ZIPALIGN.txt
            green-empire-v10-final/SOURCE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
