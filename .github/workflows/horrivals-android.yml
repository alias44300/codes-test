name: HORRIVALS Android APK

on:
  push:
    branches: [horrivals-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      GODOT_STATUS: stable
      PROJECT_DIR: horrivals/project
      APK_NAME: HORRIVALS-v0.2.0.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct HORRIVALS V0.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf horrivals/project
          mkdir -p horrivals/project
          unzip -t horrivals/source.zip
          unzip -q horrivals/source.zip -d horrivals/project
          test -f horrivals/project/project.godot
          test -f horrivals/project/export_presets.cfg
          test -f horrivals/project/scripts/main.gd
          test -f horrivals/project/scripts/card_widget.gd
          python3 - <<'PY'
          import json
          from pathlib import Path
          cards = json.loads(Path('horrivals/project/data/cards.json').read_text())
          assert len(cards) == 120, len(cards)
          assert len({c['id'] for c in cards}) == 120
          print('Roster validated:', len(cards), 'cards')
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Download Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
          GODOT_BIN="$(find "$HOME/godot-bin" -maxdepth 1 -type f -name 'Godot_*linux.x86_64' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          "$GODOT_BIN" --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/android_release.apk"

      - name: Restore persistent prototype signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/horrivals-signing"
          KEYSTORE="$RUNNER_TEMP/horrivals-signing/horrivals-dev.keystore"
          printf '%s' '' | base64 -d > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass 'horrivals-dev-2026' -alias horrivalsdev >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=horrivalsdev" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=horrivals-dev-2026" >> "$GITHUB_ENV"

      - name: Import project and validate scripts
        working-directory: horrivals/project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --import --quit --path . 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" "$RUNNER_TEMP/godot-import.log"; then
            echo 'Godot script validation failed.' >&2
            exit 1
          fi

      - name: Runtime smoke test
        working-directory: horrivals/project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 10 2>&1 | tee "$RUNNER_TEMP/godot-runtime.log"
          if grep -E "SCRIPT ERROR|Invalid call|Invalid argument|ERROR: Failed to load" "$RUNNER_TEMP/godot-runtime.log"; then
            echo 'Godot runtime smoke test failed.' >&2
            exit 1
          fi

      - name: Export signed Android APK
        working-directory: horrivals/project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release Android "build/$APK_NAME" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "build/$APK_NAME"

      - name: Verify APK signature, alignment and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/horrivals/project/build/$APK_NAME"
          OUT="$GITHUB_WORKSPACE/horrivals/package"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/$APK_NAME" | tee "$OUT/CERTIFICATE_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$OUT/$APK_NAME" | tee "$OUT/ZIPALIGN_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/$APK_NAME" | tee "$OUT/APK_BADGING.txt"
          grep -q "package: name='com.horrivals.combat'" "$OUT/APK_BADGING.txt"
          grep -q "versionName='0.2.0'" "$OUT/APK_BADGING.txt"
          grep -q "application-label:'HORRIVALS'" "$OUT/APK_BADGING.txt"
          printf '%s\n' \
            'HORRIVALS Android V0.2' \
            'Godot: 4.7.2-stable' \
            'Package: com.horrivals.combat' \
            'Version: 0.2.0 (2)' \
            'Roster: 120 cards' \
            'Combat: player chooses ATTAQUE or DÉFENSE every confrontation' \
            'Prototype signing key: persistent from V0.2 onward' \
            'Physical-device test: not performed by CI' \
            > "$OUT/BUILD_REPORT.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload APK package
        uses: actions/upload-artifact@v4
        with:
          name: HORRIVALS_V0.2_Android_APK
          path: horrivals/package/*
          if-no-files-found: error
          retention-days: 30
