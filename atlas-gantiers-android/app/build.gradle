plugins { id 'com.android.application' }

android {
    namespace 'fr.atlasgantiers.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.atlasgantiers.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.0.6'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
        safe {
            initWith debug
            applicationIdSuffix '.safe'
            versionNameSuffix '-parallele'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
