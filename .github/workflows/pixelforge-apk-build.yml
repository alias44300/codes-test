name: PixelForge Studio v0.9 APK

on:
  push:
    branches: [pixelforge-apk-build]
    paths:
      - '.github/workflows/pixelforge-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct source and prove archive integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, re, sys, zipfile
          from pathlib import Path

          root = Path('pixelforge-apk')
          src = root / 'source_zip'
          archive = root / 'reconstructed-source.zip'
          build = root / 'buildsrc'
          expected = '4df25e5d52fcd6e9d4572728a79594ae9cc362991ee73a35382965c0829dc4e7'

          chunks = sorted(
              src.glob('chunk_*.b64'),
              key=lambda p: int(re.search(r'(\d+)$', p.stem).group(1)),
          )
          expected_names = [f'chunk_{i:02d}.b64' for i in range(26)]
          actual_names = [p.name for p in chunks]
          if actual_names != expected_names:
              print('CHUNK_SET_MISMATCH', actual_names)
              sys.exit(20)

          encoded = ''.join(p.read_text(encoding='utf-8') for p in chunks)
          encoded = ''.join(encoded.split())
          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              print('BASE64_DECODE_FAILED', type(exc).__name__, str(exc))
              sys.exit(21)

          digest = hashlib.sha256(payload).hexdigest()
          print('RECONSTRUCTED_SOURCE_SHA256=', digest)
          (root / 'RECONSTRUCTED_SOURCE_SHA256.txt').write_text(
              f'{digest}  reconstructed-source.zip\n', encoding='utf-8'
          )
          if digest != expected:
              print('SOURCE_SHA_MISMATCH expected=', expected, 'actual=', digest)
              sys.exit(22)

          archive.write_bytes(payload)
          if build.exists():
              import shutil
              shutil.rmtree(build)
          build.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad is not None:
                  print('ZIP_CRC_FAILURE=', bad)
                  sys.exit(23)
              z.extractall(build)

          required = [
              build / 'settings.gradle.kts',
              build / 'build.gradle.kts',
              build / 'gradle.properties',
              build / 'app/build.gradle.kts',
              build / 'app/src/main/AndroidManifest.xml',
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              print('MISSING_REQUIRED=', ','.join(missing))
              sys.exit(24)
          print('SOURCE_ARCHIVE_INTEGRITY=PASS')
          PY

      - name: Install Android SDK 37 packages
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"

      - name: Unit tests and assemble debug APK
        working-directory: pixelforge-apk/buildsrc
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/pixelforge-apk/buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$GITHUB_WORKSPACE/pixelforge-apk/package"
          test -s "$APK"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/PixelForgeStudio-0.9.0-debug.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$OUT/PixelForgeStudio-0.9.0-debug.apk" | tee "$OUT/APKSIGNER_REPORT.txt"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$OUT/PixelForgeStudio-0.9.0-debug.apk" | tee "$OUT/AAPT_BADGING.txt"
          unzip -t "$OUT/PixelForgeStudio-0.9.0-debug.apk" | tee "$OUT/ZIP_INTEGRITY.txt"
          grep -q "package: name='com.pixelforge.studio'" "$OUT/AAPT_BADGING.txt"
          grep -q "versionName='0.9.0'" "$OUT/AAPT_BADGING.txt"
          sha256sum "$OUT/PixelForgeStudio-0.9.0-debug.apk" | tee "$OUT/PixelForgeStudio-0.9.0-debug.apk.sha256"
          cp "$GITHUB_WORKSPACE/pixelforge-apk/RECONSTRUCTED_SOURCE_SHA256.txt" "$OUT/RECONSTRUCTED_SOURCE_SHA256.txt"
          printf '%s\n' \
            'PixelForge Studio 0.9.0' \
            'Build type: debug APK' \
            'compileSdk/targetSdk: 37' \
            'Gradle: 9.5.0' \
            'JDK: 17' \
            'Source archive SHA-256: verified against Milestone 9' \
            'Unit tests: passed before packaging' \
            'APK verification: apksigner + aapt + unzip CRC' \
            'Physical-device test: not performed by this workflow' \
            > "$OUT/BUILD_REPORT.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForgeStudio-0.9.0-debug-apk
          path: pixelforge-apk/package/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK to temporary branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pixelforge-apk/package/PixelForgeStudio-0.9.0-debug.apk \
                     pixelforge-apk/package/PixelForgeStudio-0.9.0-debug.apk.sha256 \
                     pixelforge-apk/package/APKSIGNER_REPORT.txt \
                     pixelforge-apk/package/AAPT_BADGING.txt \
                     pixelforge-apk/package/ZIP_INTEGRITY.txt \
                     pixelforge-apk/package/RECONSTRUCTED_SOURCE_SHA256.txt \
                     pixelforge-apk/package/BUILD_REPORT.txt
          if git diff --cached --quiet; then
            echo 'Package already current; nothing to commit.'
          else
            git commit -m 'build: publish verified PixelForge 0.9 debug APK'
            git push origin HEAD:pixelforge-apk-build
          fi
