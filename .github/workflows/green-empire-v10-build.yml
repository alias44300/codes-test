name: Green Empire v1.0 Android APK

on:
  push:
    branches: [green-empire-v1.0-apk-build]
    paths:
      - 'green-empire-v10-final/**'
      - '.github/workflows/green-empire-v10-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          root = Path('green-empire-v10-final/source_zip')
          parts = sorted(root.glob('part_*.b64'))
          expected_names = [
              'part_00.b64','part_01.b64','part_02.b64','part_03.b64','part_04.b64','part_05.b64',
              'part_06_07.b64','part_08_09.b64','part_10_11.b64','part_12_13.b64',
              'part_14_15.b64','part_16_17.b64','part_18_19.b64','part_20_21.b64',
              'part_22_23.b64','part_24_25.b64','part_26_27.b64'
          ]
          names = [p.name for p in parts]
          if names != expected_names:
              raise SystemExit(f'Unexpected source parts: {names}')
          raw = ''.join(p.read_text(encoding='utf-8') for p in parts)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          data = base64.b64decode(clean, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = 'f85e378faf68361391771e1c9f3ed8710aa2325e6ee3771696758f0eacdcdf5e'
          print('source sha256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA mismatch: expected {expected}, got {digest}')
          archive = Path('green-empire-v10-final/source.zip')
          archive.write_bytes(data)
          PY
          unzip -t green-empire-v10-final/source.zip
          rm -rf green-empire-v10-final/buildsrc
          mkdir -p green-empire-v10-final/buildsrc
          unzip -q green-empire-v10-final/source.zip -d green-empire-v10-final/buildsrc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify project
        working-directory: green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/verify_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android debug APK with Godot 4.3
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          verbose: true

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete"
          APK="$PROJECT/build/Green_Empire_Europe_v1.0.apk"
          test -s "$APK"
          sdkmanager 'build-tools;35.0.0' >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$PROJECT/build/APK_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" | tee "$PROJECT/build/ZIPALIGN.txt"
          (cd "$PROJECT/build" && sha256sum Green_Empire_Europe_v1.0.apk > Green_Empire_Europe_v1.0.apk.sha256)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Android-debug
          path: |
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk.sha256
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/APK_SIGNATURE.txt
            green-empire-v10-final/buildsrc/Green_Empire_Europe_v1.0_Complete/build/ZIPALIGN.txt
          if-no-files-found: error
          retention-days: 30
