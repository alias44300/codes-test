name: Naïm Book v1.3 Illustrated Installable APK

on:
  push:
    branches: [naim-book-android]
    paths:
      - '.github/assets/naim_page_001.b64'
      - '.github/scripts/naim_illustration_v13.py'
      - '.github/workflows/naim-book-v13-illustrated-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild clean natural-voice book and add page 1 illustration
        run: |
          set -euo pipefail
          python3 .github/scripts/naim_clean_ui_v11.py
          python3 .github/scripts/naim_voice_v12.py
          python3 .github/scripts/naim_illustration_v13.py
          PROJECT='naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android'
          unzip -t naim-book-android/Naim_Mondes_Impossibles_Android_v1.3_Illustrated_Source.zip
          node --check "$PROJECT/app/src/main/assets/app.js"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android')
          b=json.loads((p/'app/src/main/assets/book.json').read_text(encoding='utf-8'))
          assert b['pageCount']==240 and b['sceneCount']==60
          assert sum(len(s['choices']) for c in b['chapters'] for s in c['scenes'])==180
          assert (p/'app/src/main/assets/illustrations/page_001.webp').stat().st_size > 50000
          js=(p/'app/src/main/assets/app.js').read_text(encoding='utf-8')
          assert "0: 'illustrations/page_001.webp'" in js
          java=(p/'app/src/main/java/com/naim/mondesimpossibles/MainActivity.java').read_text(encoding='utf-8')
          assert 'getVoices()' in java and 'playSilentUtterance' in java
          g=(p/'app/build.gradle').read_text(encoding='utf-8')
          assert "applicationId 'com.naim.mondesimpossibles.illustrated'" in g
          assert "versionName '1.3.0'" in g
          print('Book + natural voice + page 1 illustration + separate installable package: OK')
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Create signing key
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          KEYSTORE="$GITHUB_WORKSPACE/naim-book-android/release-v13.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 -alias naimbook -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname 'CN=Naim Mondes Impossibles Illustrated, OU=Android Book, O=Naim Book, C=FR'
          echo "NAIM_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "NAIM_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "NAIM_KEY_ALIAS=naimbook" >> "$GITHUB_ENV"
          echo "NAIM_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android
        run: gradle --no-daemon --stacktrace clean :app:assembleRelease

      - name: Verify modern APK signature and package
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android"
          OUT="$GITHUB_WORKSPACE/naim-book-android/package-v13-illustrated"
          mkdir -p "$OUT"
          APK="$OUT/Naim_et_les_Mondes_Impossibles_v1.3_installable_page1.apk"
          cp "$PROJECT/app/build/outputs/apk/release/app-release.apk" "$APK"
          cp "$GITHUB_WORKSPACE/naim-book-android/Naim_Mondes_Impossibles_Android_v1.3_Illustrated_Source.zip" "$OUT/"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > "$OUT/ZIPALIGN_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$OUT/CERTIFICATE_REPORT.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/CERTIFICATE_REPORT.txt"
          printf '%s\n' \
            'Package: com.naim.mondesimpossibles.illustrated' \
            'Version: 1.3.0' \
            'Pages: 240' \
            'Choice options: 180' \
            'Page 1 illustration: included' \
            'Narration: natural French voice selection from v1.2' \
            'APK Signature Scheme v2: verified' \
            'Install alongside old v1.2: yes' \
            'Minimum Android: 7.0' > "$OUT/BUILD_REPORT.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Naim-Mondes-Impossibles-v1.3-installable-page1
          path: naim-book-android/package-v13-illustrated/*
          if-no-files-found: error
          retention-days: 30
