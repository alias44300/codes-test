name: Green Empire Source Diagnostic

on:
  push:
    branches: [green-empire-v1.0-apk-build]
    paths:
      - '.github/workflows/green-empire-source-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root=Path('green-empire-v10-safe/source_zip')
          names=[f'chunk_{i:02d}.b64' for i in range(17)]
          names[9]='chunk_09_fixed.b64'
          data=b''.join(base64.b64decode((root/n).read_text().strip(),validate=True) for n in names)
          got=hashlib.sha256(data).hexdigest(); want='af16633f39da2e5124788b2ce429c67b60cd1000b2298f662c3bd603f1363e53'
          print('source sha256:',got)
          if got!=want: raise SystemExit(f'SHA mismatch: {got}')
          Path('source.zip').write_bytes(data)
          PY
          unzip -q source.zip -d source
          test -f source/Green_Empire_Europe_v1.0_Complete/scenes/main.tscn
          test -f source/Green_Empire_Europe_v1.0_Complete/scripts/map/dynamic_logistics_map.gd
          test -f source/Green_Empire_Europe_v1.0_Complete/project.godot
      - name: Upload exact source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-source-diagnostic
          path: source/Green_Empire_Europe_v1.0_Complete
          if-no-files-found: error
          retention-days: 2
