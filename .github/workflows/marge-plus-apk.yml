name: Build and verify Marge Plus

on:
  push:
    branches: [marge-android-apk]
    paths:
      - 'marge-plus/**'
      - '.github/workflows/marge-plus-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: marge-plus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests, release package and lint
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease --stacktrace
      - name: Package unsigned release and official signing tool
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/Marge-Plus-2.0.0-unsigned.apk
          signing_tool=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          cp "$signing_tool" delivery/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > delivery/apk-info.txt
          sha256sum delivery/Marge-Plus-2.0.0-unsigned.apk > delivery/build-sha256.txt
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 runtime tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: marge-plus
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Download/MargePlusQA delivery/qa
      - name: Upload build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marge-Plus-build-and-checks
          path: |
            marge-plus/delivery/
            marge-plus/app/build/reports/tests/
            marge-plus/app/build/reports/androidTests/
            marge-plus/app/build/reports/lint-results-release.html
            marge-plus/app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 30
