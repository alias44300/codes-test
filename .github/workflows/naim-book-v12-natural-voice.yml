name: Naïm Book v1.2 Natural Voice APK

on:
  push:
    branches: [naim-book-android]
    paths:
      - '.github/scripts/naim_voice_v12.py'
      - '.github/workflows/naim-book-v12-natural-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild clean v1.1 base and apply natural narrator
        run: |
          set -euo pipefail
          python3 .github/scripts/naim_clean_ui_v11.py
          python3 .github/scripts/naim_voice_v12.py
          unzip -t naim-book-android/Naim_Mondes_Impossibles_Android_v1.2_Source.zip
          node --check naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android/app/src/main/assets/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android')
          b=json.loads((p/'app/src/main/assets/book.json').read_text(encoding='utf-8'))
          assert b['pageCount']==240
          assert b['sceneCount']==60
          assert sum(len(s['choices']) for c in b['chapters'] for s in c['scenes'])==180
          java=(p/'app/src/main/java/com/naim/mondesimpossibles/MainActivity.java').read_text(encoding='utf-8')
          assert 'getVoices()' in java and 'setVoice(preferredVoice)' in java
          assert 'playSilentUtterance' in java
          assert '0.88f' in java and '1.04f' in java
          gradle=(p/'app/build.gradle').read_text(encoding='utf-8')
          assert "versionName '1.2.0'" in gradle
          print('240 pages / 60 decisions / 180 options + natural narrator selection: OK')
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Create signing key
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          KEYSTORE="$GITHUB_WORKSPACE/naim-book-android/release-v12.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 -alias naimbook -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname 'CN=Naim Mondes Impossibles, OU=Android Book, O=Naim Book, C=FR'
          echo "NAIM_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "NAIM_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "NAIM_KEY_ALIAS=naimbook" >> "$GITHUB_ENV"
          echo "NAIM_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build signed release
        working-directory: naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android
        run: gradle --no-daemon --stacktrace clean :app:assembleRelease
      - name: Verify and package
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/naim-book-android/buildsrc-v11/Naim_Mondes_Impossibles_Android"
          OUT="$GITHUB_WORKSPACE/naim-book-android/package-v12"
          mkdir -p "$OUT"
          cp "$PROJECT/app/build/outputs/apk/release/app-release.apk" "$OUT/Naim_et_les_Mondes_Impossibles_v1.2_voix_naturelle.apk"
          cp "$GITHUB_WORKSPACE/naim-book-android/Naim_Mondes_Impossibles_Android_v1.2_Source.zip" "$OUT/"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/Naim_et_les_Mondes_Impossibles_v1.2_voix_naturelle.apk" > "$OUT/CERTIFICATE_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$OUT/Naim_et_les_Mondes_Impossibles_v1.2_voix_naturelle.apk" > "$OUT/ZIPALIGN_REPORT.txt"
          printf '%s\n' 'Package: com.naim.mondesimpossibles' 'Version: 1.2.0' 'Pages: 240' 'Scenes: 60' 'Choice points: 60' 'Choice options: 180' 'Narration: selects best available French high-quality TTS voice' 'Network natural voice preferred: yes' 'Offline fallback: yes' 'Story pauses: yes' 'Speech rate: 0.88' 'Pitch: 1.04' 'Technical child-facing labels removed: yes' 'Auto-save: yes' 'Minimum Android: 7.0' > "$OUT/BUILD_REPORT.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Naim-Mondes-Impossibles-v1.2-natural-voice
          path: naim-book-android/package-v12/*
          if-no-files-found: error
          retention-days: 30
