name: Build Marge Android APK

on:
  push:
    branches: [marge-android-apk]
    paths:
      - "marge-android/**"
      - ".github/workflows/marge-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marge-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Marge-Android-APK
          path: marge-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
