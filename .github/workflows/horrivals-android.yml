name: HORRIVALS V0.3 Android APK

on:
  push:
    branches: [horrivals-v03]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      GODOT_STATUS: stable
      PROJECT_DIR: horrivals/project
      APK_NAME: HORRIVALS-v0.3.0.apk
      SOURCE_SHA256: 296b26ca18302fb4deb90441add10fe3d733e2d38a8e075c990d78398bc40e5c

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify HORRIVALS V0.3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          cat \
            horrivals/v03/chunk_00.b64 \
            horrivals/v03/chunk_01.b64 \
            horrivals/v03/chunk_02.b64 \
            horrivals/v03/chunk_03.b64 \
            horrivals/v03/chunk_04.b64 \
            horrivals/v03/chunk_05.b64 \
            horrivals/v03/chunk_06_07.b64 \
            horrivals/v03/chunk_08_09.b64 \
            | tr -d '\n\r\t ' | base64 -d > "$RUNNER_TEMP/horrivals-v03-source.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/horrivals-v03-source.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/horrivals-v03-source.zip"
          unzip -q "$RUNNER_TEMP/horrivals-v03-source.zip" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          test -f "$PROJECT_DIR/scripts/main.gd"
          test -f "$PROJECT_DIR/scripts/card_widget.gd"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cards = json.loads(Path('horrivals/project/data/cards.json').read_text())
          assert len(cards) == 120, f'Expected 120 cards, got {len(cards)}'
          assert len({c['id'] for c in cards}) == 120, 'Duplicate card IDs'
          required = {'id', 'name', 'universe', 'attack', 'defense', 'threat'}
          for card in cards:
              missing = required - set(card)
              assert not missing, f"{card.get('id', '?')}: missing {missing}"
          print('Roster validated:', len(cards), 'cards')
          PY
          grep -q 'STARTER_SIZE' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'FRISSON' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'CAUCHEMAR' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'MAUDIT' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'STARTING_COINS' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'version/name="0.3.0"' "$PROJECT_DIR/export_presets.cfg"
          ! grep -q 'ScrollContainer' "$PROJECT_DIR/scripts/main.gd"
          ! grep -Rni 'effroi' "$PROJECT_DIR/scripts"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Download Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
          GODOT_BIN="$(find "$HOME/godot-bin" -maxdepth 1 -type f -name 'Godot_*linux.x86_64' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          "$GODOT_BIN" --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/android_release.apk"

      - name: Restore prototype signing cache
        uses: actions/cache@v4
        with:
          path: ~/.horrivals-signing
          key: horrivals-prototype-signing-v1

      - name: Prepare persistent prototype signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.horrivals-signing"
          KEYSTORE="$HOME/.horrivals-signing/horrivals-dev.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias horrivalsdev -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass 'horrivals-dev-2026' -keypass 'horrivals-dev-2026' \
              -dname 'CN=HORRIVALS Prototype, OU=Game, O=HORRIVALS, C=FR'
          fi
          keytool -list -keystore "$KEYSTORE" -storepass 'horrivals-dev-2026' -alias horrivalsdev >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=horrivalsdev" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=horrivals-dev-2026" >> "$GITHUB_ENV"

      - name: Import project and validate scripts
        working-directory: horrivals/project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --import --quit --path . 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi

      - name: Runtime smoke test
        working-directory: horrivals/project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 10 2>&1 | tee "$RUNNER_TEMP/godot-runtime.log"
          if grep -E 'SCRIPT ERROR|Invalid call|Invalid argument|ERROR: Failed to load' "$RUNNER_TEMP/godot-runtime.log"; then exit 1; fi

      - name: Export signed Android APK
        working-directory: horrivals/project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release Android "build/$APK_NAME" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "build/$APK_NAME"

      - name: Verify APK signature, alignment and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/horrivals/project/build/$APK_NAME"
          OUT="$GITHUB_WORKSPACE/horrivals/package"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/$APK_NAME" | tee "$OUT/CERTIFICATE_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$OUT/$APK_NAME" | tee "$OUT/ZIPALIGN_REPORT.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/$APK_NAME" | tee "$OUT/APK_BADGING.txt"
          grep -q "package: name='com.horrivals.combat'" "$OUT/APK_BADGING.txt"
          grep -q "versionName='0.3.0'" "$OUT/APK_BADGING.txt"
          grep -q "application-label:'HORRIVALS'" "$OUT/APK_BADGING.txt"
          printf '%s\n' \
            'HORRIVALS Android V0.3.0' \
            'Godot: 4.7.2-stable' \
            'Package: com.horrivals.combat' \
            'Version: 0.3.0 (4)' \
            'Roster: 120 cards' \
            'Starter: 5 unique cards, first team auto-created' \
            'Packs: FRISSON 100 / CAUCHEMAR 250 / MAUDIT 500, one card each' \
            'Duplicates: converted into coins' \
            'Navigation: paged horizontal touch + bottom dock, no side scrollbar' \
            'Combat: ATTAQUE or DÉFENSE directly on played card' \
            'Runtime: GitHub headless smoke test passed' \
            'Physical-device test: not performed by CI' \
            > "$OUT/BUILD_REPORT.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload APK package
        uses: actions/upload-artifact@v4
        with:
          name: HORRIVALS_V0.3.0_Android_APK
          path: horrivals/package/*
          if-no-files-found: error
          retention-days: 30
