name: Green Empire v1.0 Safe Android APK

on:
  push:
    branches: [green-empire-v1.0-apk-build]
    paths:
      - 'green-empire-v10-safe/**'
      - '.github/workflows/green-empire-v10-safe-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'green-empire-v10-safe/**'
      - '.github/workflows/green-empire-v10-safe-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify safe source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('green-empire-v10-safe/source_zip')
          parts = [root / f'chunk_{i:02d}.b64' for i in range(17)]
          expected_text_sha = [
              '2622a597ab1b4aeaaf2c309708497fd0000b39d6926361f81683cf2854a8ec11',
              '14c8da8add3217e10d07ffe32df0d752cb31a978f67735c6e008857dcff75f14',
              '164932f304012447139ce2f4222b9eb74e690c66cf504b37c2d5af0fef093311',
              'f8a3b76ec3f286216e9bc02b750356b9d4b8a71dbad6b2cd859872e9b3f6c4d8',
              '9b82f1b73ca00713f08d7d2a45496ee926a9d4bb3372d9519d2f1f4742c54122',
              '8166f9b316a6fd8dbfb83e95417eea94065585a75abe18b5069275447e86b1ca',
              '70f7640770a990836fb7d981f7dc7a52ba3acbf3290504436b0f28d3fffff924',
              'a23480d32d1cc9bb0b58083712f755a3b0e1ca559fa1e611285b58e789159973',
              '4a110559ee664719fceaaeaa45f8263a903c4c8d898e8779e7dfc7380b4d4936',
              '1daa319983a6294c3561673494368975c9e14bbe450b067f0e9867767c3b8499',
              '296e09ca8a29a1c7e9dd3d9e0d4ae32e435e50fa2d3b5542b180d1fa99e2f191',
              'c531afcd6664a0c296f9b7a993424349de02ace4577014e71f45bd287bf85bc1',
              'fdfb45ff4fe86113caf6544a9ae31873d891aa4c585db17c740e514f8fc41864',
              '7e1563ccf7773711a4e55999b46d829035d54f59f5ef8a58eb6821884998c4d4',
              'e900325573786d26fd6982e901d64a290c6bf29db7dcb12c957b98bc6049250c',
              '2aba61a7b35aec55b1682bba85c01803ea4d442a8ab2f91237157feb792ffe9e',
              'ab9496ec74b88bdec441bc9c0495bd210941cbb7e3be8bae7eda09c195155e15',
          ]
          decoded = []
          for i, p in enumerate(parts):
              if not p.is_file():
                  raise SystemExit(f'Missing source chunk: {p}')
              raw = p.read_bytes()
              raw_sha = hashlib.sha256(raw).hexdigest()
              print(f'{p.name}: bytes={len(raw)} sha256={raw_sha}')
              if raw_sha != expected_text_sha[i]:
                  raise SystemExit(
                      f'Chunk mismatch {p.name}: expected {expected_text_sha[i]}, got {raw_sha}'
                  )
              decoded.append(base64.b64decode(raw.strip(), validate=True))

          data = b''.join(decoded)
          digest = hashlib.sha256(data).hexdigest()
          expected = 'af16633f39da2e5124788b2ce429c67b60cd1000b2298f662c3bd603f1363e53'
          print('source sha256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA mismatch: expected {expected}, got {digest}')
          Path('green-empire-v10-safe/source.zip').write_bytes(data)
          PY
          unzip -t green-empire-v10-safe/source.zip
          rm -rf green-empire-v10-safe/buildsrc
          mkdir -p green-empire-v10-safe/buildsrc
          unzip -q green-empire-v10-safe/source.zip -d green-empire-v10-safe/buildsrc
          test -f green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/project.godot
          test -f green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/export_presets.cfg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify project
        working-directory: green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/verify_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android debug APK with Godot 4.3
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          verbose: true

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete"
          APK="$PROJECT/build/Green_Empire_Europe_v1.0.apk"
          test -s "$APK"
          sdkmanager 'build-tools;35.0.0' >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$PROJECT/build/APK_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" | tee "$PROJECT/build/ZIPALIGN.txt"
          (cd "$PROJECT/build" && sha256sum Green_Empire_Europe_v1.0.apk > Green_Empire_Europe_v1.0.apk.sha256)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green-Empire-Europe-v1.0-Android-debug-safe
          path: |
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/Green_Empire_Europe_v1.0.apk.sha256
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/APK_SIGNATURE.txt
            green-empire-v10-safe/buildsrc/Green_Empire_Europe_v1.0_Complete/build/ZIPALIGN.txt
          if-no-files-found: error
          retention-days: 30
