name: Build HORRIVALS Game Studio APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: horrivals
        run: npm install --no-audit --no-fund

      - name: Typecheck and build web game
        working-directory: horrivals
        run: npm run build

      - name: Install Chromium for smoke test
        working-directory: horrivals
        run: npx playwright install --with-deps chromium

      - name: Playtest menu, illustrations and combat flow
        working-directory: horrivals
        run: npm run test:smoke

      - name: Create Capacitor Android project
        working-directory: horrivals
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: horrivals/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Re-sign with stable HORRIVALS prototype key
        working-directory: horrivals
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          INPUT="android/app/build/outputs/apk/debug/app-debug.apk"
          STRIPPED="android/app/build/outputs/apk/debug/app-v4-stripped.apk"
          ALIGNED="android/app/build/outputs/apk/debug/app-v4-aligned.apk"
          OUTPUT="android/app/build/outputs/apk/debug/HORRIVALS-V4-AUDIT.apk"

          cp "$INPUT" "$STRIPPED"
          zip -d "$STRIPPED" 'META-INF/*' >/dev/null 2>&1 || true
          "$ZIPALIGN" -f -P 16 -v 4 "$STRIPPED" "$ALIGNED" >/dev/null

          # Public AOSP development key: stable for prototype upgrades only, never for a production release.
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/horrivals-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/horrivals-testkey.x509.pem
          "$APKSIGNER" sign \
            --key /tmp/horrivals-testkey.pk8 \
            --cert /tmp/horrivals-testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT" "$ALIGNED"

      - name: Verify APK package, alignment and signature
        working-directory: horrivals
        run: |
          APK="android/app/build/outputs/apk/debug/HORRIVALS-V4-AUDIT.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish installable APK and audit captures
        uses: actions/upload-artifact@v4
        with:
          name: HORRIVALS-GameStudio-Android
          if-no-files-found: error
          retention-days: 7
          path: |
            horrivals/android/app/build/outputs/apk/debug/HORRIVALS-V4-AUDIT.apk
            horrivals/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            horrivals/audit-home.png
            horrivals/audit-combat.png
            horrivals/audit-illustrations.png
